<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- vdisk-server's org.kernel.TCMUService1 service, used by targetcli. Install in /etc/dbus-1/system.d/.
     Taken from tcmu-runner's tcmu-runner.conf, without the HandlerManager1 rule vdisk-server does not use. -->
<busconfig>
<policy user="root">
  <allow own="org.kernel.TCMUService1"/>
</policy>
<policy context="default">
  <allow send_destination="org.kernel.TCMUService1"/>
  <allow send_interface="org.kernel.TCMUService1"/>
</policy>
</busconfig>
